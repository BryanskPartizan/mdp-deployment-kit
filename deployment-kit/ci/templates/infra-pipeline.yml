# Файл описывает CI/CD-конвейер инфраструктурного контура deployment-kit.
stages:
  - validate
  - plan
  - apply
  - edge
  - bootstrap
  - vault
  - platform
  - gitlab
  - apps
  - smoke
  - network
  - security
  - integration
  - resilience
  - cleanup

variables:
  ENV: "vm-dev"
  ALLOW_INSECURE_DEMO_SECRETS: "false"

default:
  before_script:
    # Все действия CI идут через те же Makefile targets, что и локальный запуск.
    - chmod +x ci/scripts/*.sh
    - find tests -name '*.sh' -exec chmod +x {} +

validate:
  stage: validate
  script:
    - make validate ENV="${ENV}"

plan:
  stage: plan
  script:
    - make infra-plan ENV="${ENV}"
  artifacts:
    when: always
    access: maintainer
    paths:
      - .artifacts/${ENV}/tfplan
    expire_in: 1 week

apply:
  stage: apply
  when: manual
  script:
    - make infra-apply ENV="${ENV}"
  artifacts:
    when: always
    access: maintainer
    paths:
      - .artifacts/${ENV}/terraform-outputs.json
      - ansible/inventory/generated/hosts.yml
    expire_in: 1 week

edge_apply:
  stage: edge
  when: manual
  script:
    - make edge-apply ENV="${ENV}"
  artifacts:
    when: always
    access: maintainer
    paths:
      - .artifacts/${ENV}/edge-outputs.json
      - .artifacts/${ENV}/hosts-file
      - .artifacts/${ENV}/hosts-*
    expire_in: 1 week

kubeadm_bootstrap:
  stage: bootstrap
  when: manual
  script:
    - make kubeadm-bootstrap ENV="${ENV}"
  artifacts:
    # kubeconfig нужен следующим manual-стадиям, но это чувствительный артефакт.
    # Join-команды не публикуем: они остаются только в защищённом workspace runner'а.
    access: maintainer
    paths:
      - .artifacts/${ENV}/admin.conf
    expire_in: 2 hours

deploy_vault:
  stage: vault
  when: manual
  script:
    - make deploy-vault ENV="${ENV}"
    - make vault-init ENV="${ENV}"
    - make vault-configure ENV="${ENV}"

deploy_platform:
  stage: platform
  when: manual
  script:
    - make deploy-platform ENV="${ENV}"

deploy_gitlab:
  stage: gitlab
  when: manual
  script:
    - make deploy-gitlab ENV="${ENV}"

deploy_apps:
  stage: apps
  when: manual
  script:
    - make deploy-apps ENV="${ENV}"

smoke:
  stage: smoke
  script:
    - make test-smoke ENV="${ENV}"

network:
  stage: network
  script:
    - make test-network ENV="${ENV}"

security:
  stage: security
  script:
    - make test-security ENV="${ENV}"

integration:
  stage: integration
  script:
    - make test-integration ENV="${ENV}"
    - make test-storage ENV="${ENV}"

gitlab:
  stage: integration
  script:
    - make test-gitlab ENV="${ENV}"

resilience:
  stage: resilience
  script:
    - make test-resilience ENV="${ENV}"

worker_drain:
  stage: resilience
  when: manual
  script:
    - make test-fail-node ENV="${ENV}"

kubeadm_reset:
  stage: cleanup
  when: manual
  script:
    - CONFIRM_RESET="${ENV}" make kubeadm-reset ENV="${ENV}"

infra_destroy:
  stage: cleanup
  when: manual
  script:
    - CONFIRM_DESTROY="${ENV}" make infra-destroy ENV="${ENV}"
