# Файл описывает CI/CD-конвейер для соответствующего контура решения.
stages:
  - validate
  - plan
  - apply
  - bootstrap
  - platform

variables:
  TF_IN_AUTOMATION: "true"

validate:
  stage: validate
  script:
    - terraform -chdir=terraform/vm fmt -check
    - terraform -chdir=terraform/vm init -backend=false -input=false
    - terraform -chdir=terraform/vm validate
    - ansible-playbook -i ansible/inventory/static/hosts.example.yml --syntax-check ansible/playbooks/site.yml

plan:
  stage: plan
  script:
    - ./ci/scripts/terraform-plan.sh vm-dev
  artifacts:
    paths:
      - .artifacts/vm-dev/tfplan

apply:
  stage: apply
  when: manual
  script:
    - ./ci/scripts/terraform-apply.sh vm-dev

bootstrap:
  stage: bootstrap
  when: manual
  script:
    - ./ci/scripts/ansible-kubeadm-bootstrap.sh vm-dev

platform:
  stage: platform
  when: manual
  script:
    - ./ci/scripts/deploy-platform.sh vm-dev
