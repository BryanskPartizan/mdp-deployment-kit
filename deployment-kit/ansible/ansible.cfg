# Базовая конфигурация Ansible для работы с inventory и playbooks проекта.
[defaults]
inventory = inventory/generated/hosts.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
roles_path = roles
local_tmp = .ansible/tmp
# Отключаем устаревающую инъекцию ansible_* facts как top-level переменных.
inject_facts_as_vars = False

[ssh_connection]
# Узлы стенда пересоздаются часто, поэтому known_hosts не должен блокировать bootstrap.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
