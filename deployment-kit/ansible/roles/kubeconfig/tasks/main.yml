# Файл относится к слою конфигурации и bootstrap Kubernetes-кластера.
- name: Проверка локального каталога артефактов
  delegate_to: localhost
  file:
    path: "{{ cluster_artifacts_dir }}"
    state: directory
    mode: '0755'

- name: Fetch admin kubeconfig to local artifacts
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ cluster_artifacts_dir }}/admin.conf"
    flat: true

- name: Фиксация HA endpoint в локальном kubeconfig
  delegate_to: localhost
  become: false
  replace:
    path: "{{ cluster_artifacts_dir }}/admin.conf"
    regexp: 'server: https://[^:]+:6443'
    replace: "server: https://{{ control_plane_endpoint }}"

- name: Ограничение прав на локальный kubeconfig
  delegate_to: localhost
  become: false
  file:
    path: "{{ cluster_artifacts_dir }}/admin.conf"
    mode: '0600'
