# Файл относится к слою конфигурации и bootstrap Kubernetes-кластера.
- name: Проверка каталога kubeconfig для root
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Копирование admin kubeconfig в домашний каталог root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'

- name: Установка Flannel CNI
  environment:
    KUBECONFIG: /root/.kube/config
  command: kubectl apply -f {{ cni_manifest_url | default('https://github.com/flannel-io/flannel/releases/download/v0.27.4/kube-flannel.yml') }}
  register: cni_apply
  retries: 5
  delay: 15
  until: cni_apply.rc == 0

- name: Ожидание rollout Flannel DaemonSet
  environment:
    KUBECONFIG: /root/.kube/config
  command: kubectl -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=300s
  changed_when: false
