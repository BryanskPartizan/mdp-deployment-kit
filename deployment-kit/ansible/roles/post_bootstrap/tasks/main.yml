# Файл относится к слою конфигурации и bootstrap Kubernetes-кластера.
- name: Label worker nodes for application workloads
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl label node {{ hostvars[item].fqdn | default(item) }} node-role.kubernetes.io/worker=worker --overwrite
  loop: "{{ groups['workers'] | default([]) }}"
  changed_when: false

- name: Wait for nodes to become Ready
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

- name: Ожидание готовности CoreDNS
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl -n kube-system rollout status deployment/coredns --timeout=300s
  changed_when: false

- name: Ожидание готовности kube-proxy
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl -n kube-system rollout status daemonset/kube-proxy --timeout=300s
  changed_when: false

- name: Получение имени etcd Pod для health-check
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl -n kube-system get pods -l component=etcd -o jsonpath='{.items[0].metadata.name}'
  register: etcd_probe_pod
  changed_when: false

- name: Проверка quorum etcd через endpoint health
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: >
    kubectl -n kube-system exec {{ etcd_probe_pod.stdout }} --
    sh -ec 'ETCDCTL_API=3 etcdctl
    --endpoints={% for host in groups["control_plane"] | default([]) %}https://{{ hostvars[host].node_ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}
    --cacert=/etc/kubernetes/pki/etcd/ca.crt
    --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt
    --key=/etc/kubernetes/pki/etcd/healthcheck-client.key
    endpoint health'
  register: etcd_health
  retries: 5
  delay: 10
  until: etcd_health.rc == 0
  changed_when: false
