# Файл относится к слою конфигурации и bootstrap Kubernetes-кластера.
- name: Label worker nodes for application workloads
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl label node {{ item }} node-role.kubernetes.io/worker=worker --overwrite
  loop: "{{ groups['workers'] | default([]) }}"
  changed_when: false

- name: Wait for nodes to become Ready
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: kubectl wait --for=condition=Ready node --all --timeout=300s
