replicaCount: 2
image:
  repository: registry.lab.local/platform/frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
serviceAccount:
  create: true
  name: frontend
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
ingress:
  enabled: true
  className: nginx
  host: app.lab.local
  tlsSecretName: frontend-tls
config:
  ENVIRONMENT: dev
vault:
  enabled: true
  role: frontend
  secretPath: secret/data/app/frontend
