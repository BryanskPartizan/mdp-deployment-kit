replicaCount: 2
image:
  repository: registry.lab.local/platform/api
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
serviceAccount:
  create: true
  name: api
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
ingress:
  enabled: false
  className: nginx
  host: api.lab.local
  tlsSecretName: api-tls
config:
  ENVIRONMENT: dev
vault:
  enabled: true
  role: api
  secretPath: secret/data/app/api
