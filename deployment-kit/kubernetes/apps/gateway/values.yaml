replicaCount: 2
image:
  repository: registry.gitlab.com/example/gateway
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
ingress:
  enabled: true
  className: nginx
  host: gateway.lab.local
  tlsSecretName: gateway-tls
config:
  ENVIRONMENT: dev
vault:
  enabled: true
