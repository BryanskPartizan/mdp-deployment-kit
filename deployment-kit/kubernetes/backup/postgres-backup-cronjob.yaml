apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: app
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: postgres-password
              command:
                - /bin/sh
                - -c
                - |
                  mkdir -p /backup && \
                  pg_dump -h postgres-postgresql -U postgres appdb > /backup/appdb-$(date +%Y%m%d%H%M%S).sql
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
