# Blackbox exporter проверяет HTTP/TCP endpoint'ы без зависимости от собственных /metrics в приложениях.
replicas: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
    http_2xx_insecure:
      prober: http
      timeout: 8s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 204, 301, 302]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
        tls_config:
          insecure_skip_verify: true
    http_registry:
      prober: http
      timeout: 8s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 401]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
        tls_config:
          insecure_skip_verify: true
    tcp_connect:
      prober: tcp
      timeout: 5s

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      deployment-kit/component: blackbox-exporter
  enabled: false
