# Vault запускается в HA-режиме с интегрированным Raft-хранилищем.
server:
  dev:
    enabled: false
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path
  auditStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path
  service:
    enabled: true
    type: ClusterIP
  ingress:
    enabled: false
  # В vm-dev сейчас 2 worker-узла, а Vault HA требует 3 replica с hard anti-affinity.
  # Toleration разрешает третьей replica сесть на control-plane; для production лучше добавить третий worker.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: true
  replicas: 2
