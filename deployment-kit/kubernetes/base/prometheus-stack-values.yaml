grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.pkhco.ru
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.pkhco.ru
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
    datasources:
      enabled: true
  additionalDataSources:
    # Loki подключается как отдельный datasource, чтобы dashboards могли совмещать метрики и логи.
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
prometheus:
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    probeNamespaceSelector: {}
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi
    additionalScrapeConfigs:
      # kubeadm разворачивает etcd как static pods без Kubernetes Service.
      # Scrape настраивается через pod discovery и порт метрик 2381, который открывает kubeadm template.
      - job_name: kube-etcd
        scheme: http
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_component]
            regex: etcd
          - action: replace
            source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:2381
          - action: replace
            source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            target_label: namespace
            replacement: kube-system
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
