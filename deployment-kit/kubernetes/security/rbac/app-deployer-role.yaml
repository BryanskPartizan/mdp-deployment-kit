apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-deployer
  namespace: app
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "autoscaling"]
    resources: ["deployments", "services", "ingresses", "configmaps", "secrets", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
