apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-deployer
  namespace: app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-deployer
