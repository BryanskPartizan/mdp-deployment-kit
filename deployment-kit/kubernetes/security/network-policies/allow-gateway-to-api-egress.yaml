apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 8081
  policyTypes:
    - Egress
