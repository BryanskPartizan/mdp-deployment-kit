apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-datastores-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["postgres", "postgresql"]
              - key: app.kubernetes.io/instance
                operator: In
                values: ["postgres"]
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: redis
      ports:
        - protocol: TCP
          port: 6379
  policyTypes:
    - Egress
