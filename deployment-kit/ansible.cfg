# Корневой ansible.cfg нужен для ручных команд из каталога deployment-kit.
[defaults]
inventory = ansible/inventory/generated/hosts.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
roles_path = ansible/roles
local_tmp = .ansible/tmp

[ssh_connection]
# Узлы стенда пересоздаются часто, поэтому known_hosts не должен блокировать bootstrap.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
